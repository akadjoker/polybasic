<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>three.js reference</title>
  <style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
  </script>
</head>
<body>
  <!-- Browser check: the scene of models-external.pb drawn by three.js on
       its own (GLTFLoader, unlit), as the reference our loader and backend
       must match. PolyBasic mirrors X when it reads glTF and the three.js
       backend mirrors Z when it draws; together that is a half turn about
       Y, so here the camera is where PolyBasic's is with z negated, looking
       the other way, and the models are placed as the file has them. -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 600);
    document.body.append(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color().setRGB(150 / 255, 190 / 255, 230 / 255, THREE.SRGBColorSpace);
    const camera = new THREE.PerspectiveCamera(60, 800 / 600, 0.1, 1000);
    camera.position.set(0, 1.4, 2.2);
    camera.rotation.x = -18 * Math.PI / 180;

    const unlit = (root) => root.traverse((o) =>
    {
      if (o.isMesh) o.material = new THREE.MeshBasicMaterial({ map: o.material.map, color: 0xffffff, side: o.material.side });
    });
    const loader = new GLTFLoader();
    const load = (url) => new Promise((ok, fail) => loader.load(url, (g) => ok(g.scene), undefined, fail));
    const platform = await load('/examples/assets/kenney/platform.glb');
    // PolyBasic's view of the platform, turned half way round in three.js.
    platform.rotation.y = Math.PI;
    const guy = await load('/examples/assets/kenney/character.glb');
    // TurnEntity guy, 0, 180, 0 cancels the half turn.
    guy.position.set(0, 0.5, 0);
    unlit(platform);
    unlit(guy);
    scene.add(platform, guy);
    // Wait for the textures.
    await new Promise((r) => setTimeout(r, 500));
    renderer.render(scene, camera);
    window.referenceReady = true;
  </script>
</body>
</html>
