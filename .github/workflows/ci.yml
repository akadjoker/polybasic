name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run bench
      # dist/polybasic.js and web/vendor/codemirror.js are committed so the
      # web pages work without a build step: they must match the sources.
      - run: npm run build && npm run build:vendor && git diff --exit-code -- dist/ web/vendor/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
